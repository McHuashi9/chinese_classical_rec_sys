name: 'Build Flutter Windows'
description: 'Build Flutter Windows app with native DLL and NSIS installer'
inputs:
  version:
    description: 'Version string for NSIS installer (verified against installer.nsi; bump_version.sh keeps it in sync)'
    required: true
runs:
  using: composite
  steps:
    - name: Build chinese_core (DLL)
      shell: bash
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release --target chinese_core

    - name: Flutter build windows
      shell: bash
      run: |
        flutter pub get
        flutter build windows --release
      working-directory: flutter_app

    - name: Copy VC++ runtime DLLs
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        if (-not $vsPath) { Write-Warning "vswhere not found — skipping VC++ runtime DLL copy"; return }
        $redistBase = Join-Path $vsPath "VC\Redist\MSVC"
        if (-not (Test-Path $redistBase)) { Write-Warning "Redist dir not found"; return }
        # Redist\MSVC 下同时存在 v143 与 14.x.y 版本目录；必须排除 v143，
        # 否则 Sort-Object Name 会把 v143 排到数字版本前面，导致找不到 CRT。
        $latest = Get-ChildItem $redistBase -Directory |
          Where-Object { $_.Name -match '^\d+\.' } |
          Sort-Object { [version]$_.Name } -Descending |
          Select-Object -First 1
        if (-not $latest) { Write-Warning "No numeric VC++ Redist version dir found under $redistBase"; return }
        $crtDir = Join-Path $latest.FullName "x64\Microsoft.VC143.CRT"
        if (-not (Test-Path $crtDir)) {
          Write-Warning "CRT dir not found at $crtDir"
          return
        }
        Copy-Item "$crtDir\*" "flutter_app\build\windows\x64\runner\Release\" -Force
        Write-Host "Copied VC++ runtime DLLs from $crtDir"
        # 防止再次静默漏拷：校验 CRT 目录里的每个 DLL 都已进入 Release，
        # 避免只查 VCRUNTIME140_1.dll 而漏掉 msvcp140_1.dll/concrt140.dll 等。
        $sourceDlls = Get-ChildItem "$crtDir\*.dll" -File
        foreach ($src in $sourceDlls) {
          $dest = Join-Path "flutter_app\build\windows\x64\runner\Release" $src.Name
          if (-not (Test-Path $dest)) {
            throw "$($src.Name) 未复制到 Release 目录，请检查 VC++ Redist 路径"
          }
        }
        Write-Host "Verified $($sourceDlls.Count) VC++ runtime DLLs in Release"

    - name: Verify Windows DLL manifest and dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -c "import pefile" >/dev/null 2>&1 || python -m pip install --user pefile
        python scripts/check_windows_dlls.py \
          "flutter_app/build/windows/x64/runner/Release"

    - name: Install NSIS
      shell: bash
      run: choco install nsis -y

    - name: Verify NSIS script (UTF-8 BOM + version match)
      shell: bash
      run: |
        # Unicode true 要求脚本带 UTF-8 BOM；无 BOM 时 makensis 按系统 ANSI 代码页误读，
        # windows-2022 上是 CP1252 → 中文字符串全部乱码（v0.10.1 踩过；编辑器重写文件会剥掉 BOM）
        if [ "$(head -c 3 packaging/nsis/installer.nsi | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
          echo "::error::packaging/nsis/installer.nsi 缺少 UTF-8 BOM（前 3 字节应为 EF BB BF），请以 UTF-8 with BOM 重新保存"
          exit 1
        fi
        # 版本号唯一源是 pubspec.yaml（bump_version.sh 同步各文件）；这里只校验不注入，
        # 防止漏跑 bump 直接打 tag 时打出错误版本号的安装包
        if ! grep -q "!define PRODUCT_VERSION \"${{ inputs.version }}\"" packaging/nsis/installer.nsi; then
          echo "::error::installer.nsi 的 PRODUCT_VERSION 与 ${{ inputs.version }} 不一致，请先运行 scripts/project/bump_version.sh ${{ inputs.version }}"
          exit 1
        fi

    - name: Build NSIS installer
      shell: pwsh
      run: |
        $releasePath = (Resolve-Path "flutter_app\build\windows\x64\runner\Release").Path
        Write-Host "Release path: $releasePath"
        $nsisPaths = @(
          "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
          "${env:ProgramFiles}\NSIS\makensis.exe"
        )
        $makensis = $nsisPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $makensis) { throw "makensis.exe not found" }
        & $makensis /DRELEASE_DIR="$releasePath" packaging\nsis\installer.nsi
        Move-Item packaging\nsis\chinese-classical-rec-sys-*.exe .
