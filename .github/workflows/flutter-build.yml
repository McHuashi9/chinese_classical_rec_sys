name: Flutter Desktop Build

on:
  workflow_dispatch:
  # 代码变更自动构建（N9）：数据卷（articles/、build/ 等）与文档变更不触发，
  # 数据发布走 release 流程；覆盖率报告步骤失败不阻断打包（continue-on-error）
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'bridge/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'flutter_app/**'
      - 'scripts/**'
      - 'articles/**'
      - 'packaging/**'
      - 'requirements-ci.txt'
      - '.github/workflows/flutter-build.yml'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev liblzma-dev pkg-config fuse

      - name: Subset fonts
        run: |
          pip install fonttools
          python3 scripts/subset_fonts.py

      - name: Build chinese_core
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target chinese_core -j$(nproc)

      - name: Build and run C++ unit tests
        run: |
          cmake --build build --target run_tests -j$(nproc)
          ./build/tests/run_tests

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            flutter_app/.dart_tool
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/pubspec.yaml') }}

      - name: Flutter pub get
        run: flutter pub get
        working-directory: flutter_app

      - name: Flutter test
        run: flutter test --coverage
        working-directory: flutter_app

      - name: Flutter analyze
        run: flutter analyze
        working-directory: flutter_app

      - name: Coverage report (C++)
        # 覆盖率只出报告不设门槛（MEMORY 决策）：脚本问题不阻断打包
        continue-on-error: true
        run: |
          pip install 'gcovr>=8'
          ./scripts/test_coverage_cpp.sh

      - name: Coverage summary (Dart)
        continue-on-error: true
        run: python3 scripts/summarize_cov.py flutter_app/coverage/lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build-cov/coverage/index.html
            build-cov/coverage/coverage.json
            flutter_app/coverage/lcov.info
          retention-days: 7

      - name: Package AppImage
        run: bash packaging/appimage/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chinese-classical-linux
          path: chinese-classical-rec-sys-*-linux.AppImage
          retention-days: 7

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version: ' flutter_app/pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            flutter_app/.dart_tool
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/pubspec.yaml') }}

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: chinese-classical-windows
          path: chinese-classical-rec-sys-*.exe
          retention-days: 7

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            flutter_app/.dart_tool
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/pubspec.yaml') }}

      - name: Flutter build apk
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
        working-directory: flutter_app
      - name: Rename APK
        shell: bash
        run: |
          VERSION=$(grep '^version: ' flutter_app/pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            "chinese-classical-rec-sys-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: chinese-classical-android
          path: chinese-classical-rec-sys-*-android.apk
          retention-days: 7
