name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  flutter-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.x'

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev liblzma-dev pkg-config fuse

      - name: Subset fonts
        run: |
          python3 -m pip install fonttools
          python3 scripts/subset_fonts.py --check-only

      - name: Build chinese_core
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target chinese_core -j$(nproc)

      - uses: actions/cache@v6
        with:
          path: |
            flutter_app/.dart_tool
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/pubspec.yaml') }}

      - name: Flutter pub get
        run: flutter pub get
        working-directory: flutter_app

      - name: Flutter test
        run: flutter test
        working-directory: flutter_app

      - name: Package AppImage
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          bash packaging/appimage/build.sh "${VERSION}"
        env:
          ARCH: x86_64

      - name: Extract changelog for release body
        id: changelog
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (index($0, "## [" ver "]") == 1) { flag = 1 }
              else if (flag) { exit }
            }
            flag
          ' CHANGELOG.md > /tmp/release_body.md
          [ -s /tmp/release_body.md ] || \
            echo "No CHANGELOG entry found for v${VERSION}" > /tmp/release_body.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release_body.md
          files: chinese-classical-rec-sys-*-linux.AppImage

  flutter-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.x'

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Subset fonts
        shell: bash
        run: |
          python3 -m pip install fonttools
          python3 scripts/subset_fonts.py --check-only

      - uses: actions/cache@v6
        with:
          path: |
            flutter_app/.dart_tool
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/pubspec.yaml') }}

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: chinese-classical-rec-sys-*.exe

  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.x'
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Subset fonts
        run: |
          python3 -m pip install fonttools
          python3 scripts/subset_fonts.py --check-only

      - uses: actions/cache@v6
        with:
          path: |
            flutter_app/.dart_tool
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/pubspec.yaml') }}

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release-keystore.jks
            # PKCS12/JKS 实际密钥口令为 store 口令；keyPassword 与 storePassword 保持一致。
            printf 'storeFile=/tmp/release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE_PASSWORD" \
              > flutter_app/android/key.properties
            echo "Configured release signing from GitHub Secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 missing; release APK will fall back to debug signing."
          fi

      - name: Flutter pub get && build
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
        working-directory: flutter_app
      - name: Rename APK
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            "chinese-classical-rec-sys-${VERSION}-android.apk"
      - name: Verify APK signature
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          APK="chinese-classical-rec-sys-${VERSION}-android.apk"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            keytool -printcert -jarfile "$APK" || true
          fi
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: chinese-classical-rec-sys-*-android.apk

  ios-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.x'
      - name: Subset fonts
        run: |
          python3 -m pip install fonttools --break-system-packages
          python3 scripts/subset_fonts.py --check-only

      - name: Generate ios/
        run: |
          rm -rf flutter_app/ios
          cd flutter_app && flutter create --platforms=ios .
      - name: Apply icon & splash
        working-directory: flutter_app
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build libchinese_core.a
        run: bash scripts/project/build_ios_core.sh
      - name: Copy static lib into Runner
        run: cp build/ios/libchinese_core.a flutter_app/ios/Runner/
      - name: Build unsigned IPA
        run: flutter build ios --release --no-codesign
        working-directory: flutter_app
      - name: Package IPA
        run: |
          mkdir -p output
          cd flutter_app/build/ios/iphoneos && zip -r ../../../../output/Runner.ipa Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: output/Runner.ipa
          # IPA 已同步上传到 Release（下一步 softprops），artifact 仅供留档：
          # 保留 1 天即过期，避免默认 90 天冗余占用
          retention-days: 1
      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v3
        with:
          files: output/Runner.ipa
