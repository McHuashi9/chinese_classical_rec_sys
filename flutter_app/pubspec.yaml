name: chinese_classical_rec_sys
description: 文言文推荐系统 - Flutter Desktop 版
publish_to: 'none'
version: 1.1.1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  ffi: ^2.1.0
  path_provider: ^2.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  collection: ^1.19.0
  flutter_colorpicker: ^1.1.0
  file_selector: ^1.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#F5F0E8"
  color_dark: "#1C1812"
  image: "assets/icon/app_icon.png"
  image_dark: "assets/icon/app_icon.png"
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: "assets/icon/app_icon.png"
    image_dark: "assets/icon/app_icon.png"
    color: "#F5F0E8"
    color_dark: "#1C1812"

flutter:
  uses-material-design: true

  fonts:
    - family: SourceHanSerifSC
      fonts:
        - asset: assets/fonts/SourceHanSerifSC-Regular.otf
        - asset: assets/fonts/SourceHanSerifSC-Light.otf
          weight: 300
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
        - asset: assets/fonts/LXGWWenKai-Medium.ttf
          weight: 500
    - family: HarmonyOSSansSC
      fonts:
        - asset: assets/fonts/HarmonyOS_SansSC_Regular.ttf
        - asset: assets/fonts/HarmonyOS_SansSC_Bold.ttf
          weight: 700

  assets:
    - assets/data/classical.db
    - assets/data/db_version.txt
